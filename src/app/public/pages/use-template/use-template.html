@if (isLoading()) {
          <div class="text-center py-20 text-slate-400 font-medium">
              <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Preparando plantilla...
          </div>
      } @else {
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
              
              <div class="lg:col-span-4 space-y-6">
                  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                      <h3 class="font-black text-slate-900 mb-4 flex items-center gap-2">
                          <i class="fa-solid fa-keyboard text-blue-600"></i> Completar Datos
                      </h3>

                      @if (dynamicFields().length === 0) {
                          <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 text-sm text-slate-500 italic text-center">
                              Esta plantilla no requiere variables dinámicas. Está lista para usarse.
                          </div>
                      } @else {
                          <div class="space-y-4">
                              @for (field of dynamicFields(); track field) {
                                  <div class="flex flex-col gap-1.5">
                                      <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">{{ field }}</label>
                                      <input type="text" [(ngModel)]="dynamicValues[field]" [placeholder]="'Ingresa ' + field"
                                          class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
                                  </div>
                              }
                          </div>
                      }

                      <button (click)="copyToClipboard()"
                          class="w-full mt-6 bg-blue-600 text-white px-6 py-3.5 rounded-xl font-bold text-sm hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 flex justify-center items-center gap-2 active:scale-95">
                          <i class="fa-solid fa-copy"></i> Copiar para Outlook/Gmail
                      </button>
                  </div>
              </div>

              <div class="lg:col-span-8">
                  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col h-full">
                      <div class="bg-slate-50 px-8 py-4 border-b border-slate-200">
                          <div class="flex items-center gap-4">
                              <span class="text-xs font-bold text-slate-400 uppercase w-16">Asunto:</span>
                              <span class="text-sm font-semibold text-slate-900">{{ getProcessedSubject() }}</span>
                          </div>
                      </div>

                      <div class="p-8 prose prose-slate max-w-none prose-p:my-2 bg-white flex-1" [innerHTML]="getProcessedContent()">
                      </div>
                  </div>
              </div>
          </div>
      }
