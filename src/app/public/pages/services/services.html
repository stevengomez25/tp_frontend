<div #hostContainer class="services-stage">
  <header class="top-bar">
    <div class="brand">TempMail Pro · Servicios</div>
    <nav class="nav-actions">
      <a routerLink="/billing" class="cta-link">Ver planes</a>
    </nav>
  </header>

  <section
    *ngFor="let service of services; let i = index"
    class="slide-section"
  >
    <div class="outer">
      <div class="inner">
        <div
          class="bg"
          [style.backgroundImage]="service.accentGradient"
        >
          <div class="slide-content">
            <span class="service-badge">{{ service.badge }}</span>
            <h2 class="section-heading">{{ service.title }}</h2>
            <div class="service-copy">
              <p class="service-description">{{ service.description }}</p>
              <span class="service-footer">{{ service.footerNote }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
