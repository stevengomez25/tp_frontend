<div #hostContainer class="services-stage">
  <header class="top-bar">
    <div class="brand">TempMail Pro · Servicios</div>
    <nav class="nav-actions">
      <a routerLink="/billing" class="cta-link">Ver planes</a>
    </nav>
  </header>

  <section
    *ngFor="let service of services; let i = index"
    class="slide-section"
  >
    <div class="outer">
      <div class="inner">
        <div
          class="bg"
          [style.backgroundImage]="service.accentGradient"
        >
          <div class="slide-content">
            <span class="service-badge">{{ service.badge }}</span>
            <h2 class="section-heading">{{ service.title }}</h2>
            <div class="service-copy">
              <p class="service-description">{{ service.description }}</p>
              <span class="service-footer">{{ service.footerNote }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <div class="after-showcase bg-slate-950 border-t border-slate-800 py-20 px-6 text-center">
    <h3 class="text-2xl sm:text-3xl font-bold text-white">¿Listo para activar tu prueba de 30 días?</h3>
    <p class="mt-2 text-slate-400">Continúa a facturación o sube con el scroll para revisar los servicios.</p>
    <a routerLink="/billing" class="mt-6 inline-block px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">
      Ir a planes
    </a>
  </div>
</div>
