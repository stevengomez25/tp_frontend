<div class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <a routerLink="/" class="flex justify-center items-center gap-2 mb-6">
      <img src="slogan.png" alt="Logo" class="w-40 h-25">
    </a>
    <h2 class="text-center text-3xl font-bold tracking-tight text-slate-900">
      {{ 'signup.title' | transloco }}
    </h2>
    <p class="mt-2 text-center text-sm text-slate-600">
      {{ 'signup.subtitle' | transloco }}
      <a routerLink="/login" class="font-medium text-blue-600 hover:text-blue-500">
        {{ 'signup.login_link' | transloco }}
      </a>
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow-xl border border-slate-200 sm:rounded-2xl sm:px-10">
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-slate-700">{{ 'signup.name_label' | transloco }}</label>
          <div class="mt-1">
            <input formControlName="username" type="text"
              class="block w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-blue-500 sm:text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">{{ 'signup.email_label' | transloco }}</label>
          <div class="mt-1">
            <input formControlName="email" type="email"
              class="block w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-blue-500 sm:text-sm">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">{{ 'signup.password_label' | transloco }}</label>
          <div class="mt-1">
            <input formControlName="password" type="password"
              class="block w-full rounded-lg border border-slate-300 px-3 py-2 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-blue-500 sm:text-sm">
          </div>
        </div>

        <div class="flex items-center">
          <input formControlName="acceptTerms" type="checkbox"
            class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
          <label class="ml-2 block text-sm text-slate-900">
            {{ 'signup.terms_text' | transloco }} 
            <a href="#" class="text-blue-600 hover:underline">{{ 'signup.terms_link' | transloco }}</a>
          </label>
        </div>

        <button type="submit" [disabled]="signupForm.invalid"
          class="flex w-full justify-center rounded-lg bg-blue-600 py-2.5 px-4 text-sm font-bold text-white shadow-sm hover:bg-blue-700 disabled:opacity-50 transition-all active:scale-95">
          {{ 'signup.btn_submit' | transloco }}
        </button>
      </form>
    </div>
  </div>
</div>
